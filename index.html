<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek - Log in</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <form class="card" onsubmit="return false;">
      <div class="logo" id="logo">
        <!-- PASTE LOGO SVG HERE -->
      </div>

      <p class="notice">Only login via email, Google, or +86 phone number login is supported in your region.</p>

      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
        </svg>
        <input type="text" name="username" placeholder="Phone number / email address" autocomplete="username">
      </label>

      <label class="field">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
        </svg>
        <input type="password" id="password" name="password" placeholder="Password" autocomplete="current-password">
        <button type="button" class="toggle-pw" id="togglePw" aria-label="Show password">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </label>

      <label class="agree">
        <input type="checkbox" name="agree">
        <span>I confirm that I have read, consent and agree to DeepSeek's <a href="#">Terms of Use</a> and <a href="#">Privacy Policy</a>.</span>
      </label>

      <button type="submit" class="btn btn-primary">Log in</button>

      <div class="links">
        <a href="#">Forgot password?</a>
        <a href="#">Sign up</a>
      </div>

      <div class="divider">OR</div>

      <button type="button" class="btn btn-google">
        <svg viewBox="0 0 48 48">
          <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
          <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
          <path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/>
          <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/>
        </svg>
        Log in with Google
      </button>
    </form>
  </main>

  <footer>
    <span>浙ICP备2023025841号</span>
    <span class="sep">|</span>
    <a href="#">Contact us</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
